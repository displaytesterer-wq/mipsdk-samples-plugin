name: AutoWavExport compile
on:
  push:
    branches: [feature/auto-wav-export]
    paths:
      - 'AutoWavExport/**'
      - '.github/workflows/auto-wav-build.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Restore NuGet
        shell: pwsh
        run: nuget restore AutoWavExport/AutoWavExport.csproj -NonInteractive
      - name: Build for .NET Framework 4.7.2 x64
        shell: pwsh
        run: msbuild AutoWavExport/AutoWavExport.csproj /t:Build /p:Configuration=Release /p:Platform=x64 /verbosity:minimal
      - name: Assemble release package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = 'AutoWavExport/bin/Release'
          $exe = Join-Path $output 'AutoWavExport.exe'
          if (!(Test-Path $exe)) { throw "Missing compiled EXE: $exe" }
          New-Item -ItemType Directory -Force -Path 'package/AutoWavExport' | Out-Null
          Copy-Item "$output/*" 'package/AutoWavExport/' -Recurse -Force
          Copy-Item 'AutoWavExport/settings.example.json','AutoWavExport/Set-Password.ps1','AutoWavExport/Install-Task.ps1','AutoWavExport/README.md','AutoWavExport/TEST-PLAN.md' 'package/AutoWavExport/' -Force
          Compress-Archive -Path 'package/AutoWavExport' -DestinationPath 'AutoWavExport.zip' -Force
      - name: Upload AutoWavExport ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AutoWavExport
          path: AutoWavExport.zip
          if-no-files-found: error
          retention-days: 30
